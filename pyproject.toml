[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gestion_sources"
version = "0.1.1"
description = "Gestion des sources radioactives"
authors = [{ name = "Grégoire Dougniaux", email = "gregoire.dougniaux@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.23",
    "pymysql>=1.1.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.6",
    "passlib[bcrypt]>=1.7.4",
    "openpyxl>=3.1.2",
    "pillow>=10.1.0",
    "pytest>=7.4.3",
    "alembic>=1.12.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.0.0",
    "argon2-cffi>=23.1.0",
    "reportlab>=4.0.0",
    "pdfplumber>=0.11.0",
]

[tool.setuptools.packages.find]
exclude = ["data*", "venv*", "*.egg-info*"]

[project.optional-dependencies]
dev = [
    "black>=23.12.0",
    "flake8>=6.1.0",
    "httpx>=0.27.0",
    "isort>=5.13.2",
    "pytest-cov>=4.1.0",
]
