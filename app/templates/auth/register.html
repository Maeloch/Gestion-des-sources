{% extends "base.html" %}

{% block title %}Inscription{% endblock %}

{% block auth_content %}
    <div class="auth-card">
        <div class="auth-brand">
            <svg width="28" height="28" viewBox="0 0 30 30" fill="none">
                <path d="M2 24 C 10 24, 10 6, 15 6 C 20 6, 20 24, 28 24" stroke="#1c8c8c" stroke-width="2" stroke-linecap="round"/>
                <circle cx="15" cy="6" r="2.2" fill="#1c8c8c"/>
            </svg>
            <span class="auth-brand-text">Sources Radioactives</span>
        </div>
        <h2>Inscription</h2>
        <p class="page-lead">Le compte démarre en rôle "lecteur" ; un administrateur pourra ensuite ajuster tes droits.</p>
        <form id="registerForm">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" id="username" name="username" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>

            <label for="full_name">Nom complet</label>
            <input type="text" id="full_name" name="full_name">

            <button type="submit" class="primary">S'inscrire</button>
        </form>
        <p class="auth-foot">Déjà un compte ? <a href="/auth/login">Se connecter</a></p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                full_name: document.getElementById('full_name').value,
            };

            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData),
            });

            if (response.ok) {
                window.location.href = '/auth/login';
            } else {
                const error = await response.json();
                alert(`Erreur : ${error.detail || 'Veuillez réessayer.'}`);
            }
        });
    </script>
{% endblock %}
